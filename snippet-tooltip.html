<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <style>
    :root {
      --white: #FFFFFF;
      --ink: #394B52;
      --accent: #61bd00;
      --accent-strong: #4B9400;
      --surface: #FFFFFF;
    }

    body[data-theme="rose"] {
      --white: #FFF9FB;
      --ink: #735B64;
      --accent: #E68CA8;
      --accent-strong: #C96585;
      --surface: #FFF9FB;
    }

    body[data-theme="sky"] {
      --white: #F8FCFF;
      --ink: #506A7A;
      --accent: #8CCCE6;
      --accent-strong: #4FA8CA;
      --surface: #F8FCFF;
    }

    body[data-theme="lavender"] {
      --white: #FCFAFF;
      --ink: #625B78;
      --accent: #B8A7EA;
      --accent-strong: #927CD7;
      --surface: #FCFAFF;
    }

    body[data-theme="peach"] {
      --white: #FFFBF7;
      --ink: #746354;
      --accent: #F2B38F;
      --accent-strong: #D98C5D;
      --surface: #FFFBF7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background: transparent;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .tooltip {
      width: calc(100vw - 6px);
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 5px 7px;
      color: var(--ink);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--accent-strong);
      border-radius: 8px;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--ink) 14%, transparent);
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      min-height: 20px;
      padding: 0 8px;
      color: var(--white);
      background: var(--accent);
      border: 1px solid var(--accent-strong);
      border-radius: 4px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="tooltip">
    <span>Snippet</span>
    <span class="key" data-activation-label>SHIFT</span>
  </div>

  <script src="./snippet-tooltip.js"></script>
</body>
</html>
